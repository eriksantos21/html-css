<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: separate /*o border-collapse, permite modificar os espaços fora das bordas. O padrão é o separate que deixa separado as bordas com os dados, mas o queremos aqui é o collapse que deixa junto as bordas removendo os espaços entre elas*/;
        }

        table{
            width: 400px;
        }
        tr.linha{
            background-color: gray;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }

        td.dado{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <!--HIERARQUIA DE TABELAS (simples)
    
    TABLE = tabela
        TABLE HOW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
             TABLE DATA = data de tabela-->

             <!--A W3C não exige o fechamento das tags table, tr e td. Sem elas, o funcionamento continua o mesmo. Porém é aconselhável fechar as tags para evitar os erros de conteúdos-->
    <table>
        <tr class="linha"> <!--primeira linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr> <!--segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!--terceira linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!--quarta linha-->
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>


        <tr>
            <td>A5</td>
        </tr>
        <tr>
            <td>B5</td>
        </tr>

    </table>
</body>
</html>
