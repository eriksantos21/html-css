<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #container{
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: relative; /*por padrão, a posição da box já é relativa*/
            height: 96vh;
            padding: 10px;
            background-color:purple;
        }
        #conteudo{
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            position: absolute; /*posso modificar o "top" e o "left" se a posição for absoluta, modifico através do "px"*/
            height: 200px;
            width: 400px;
            background-color: yellow;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); /*transform é quando eu mecho em qualquer caixa aplicando alteração de transformação nessa caixa. O translate pode mover a posição da caixa. Quando usamos dois valores negativos em pixels, ele vai para esquerda e para cima. Quando usamos dois valores positivos em pixels, ele vai para direita e para baixo. Quando usamos dois valores em -50%, centralizamos a caixa.*/
        }
    </style>
    
    /*utilizamos a "semântica section" e "article". Para fazermos a centralização vertical, temos que ter a presença de um "id container" e um "id conteudo"*/

</head>
<body>
    <section id="container"> 
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
